; Production PHP settings. cPanel/PHP-FPM reads this; if the host runs
; mod_php instead, set the same values in the panel's PHP settings screen.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
upload_max_filesize = 12M
post_max_size = 13M
max_execution_time = 120
